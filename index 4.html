<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>慧记账</title>
<style>
:root{--bg:#f3f5fb;--pn:#fff;--tx:#141a33;--mu:#7b84a3;--ln:#e6e9f3;--ac:#5b4bff;--sd:0 6px 22px rgba(40,50,110,.08);--nv:rgba(255,255,255,.92);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1022;--pn:#151b36;--tx:#eaeeff;--mu:#8b94bb;--ln:#232b4d;--ac:#7c6cff;--sd:0 6px 22px rgba(0,0,0,.35);--nv:rgba(21,27,54,.92)}}
:root[data-theme="dark"]{--bg:#0b1022;--pn:#151b36;--tx:#eaeeff;--mu:#8b94bb;--ln:#232b4d;--ac:#7c6cff;--sd:0 6px 22px rgba(0,0,0,.35);--nv:rgba(21,27,54,.92)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;font-variant-numeric:tabular-nums}
@keyframes fd{from{opacity:.2}to{opacity:1}}
@keyframes up{from{transform:translateY(28px)}to{transform:none}}
#v{max-width:560px;margin:0 auto;padding:14px 16px 112px}
#v.fx{animation:fd .18s ease}
.top{display:flex;justify-content:space-between;align-items:center;margin:2px 0 16px}
.top>b{font-size:24px;font-weight:800;letter-spacing:.5px}
.brand{display:flex;align-items:center;gap:10px}
.brand b{font-size:22px;font-weight:800;letter-spacing:1px}
.ico{width:36px;height:36px;border-radius:24%;object-fit:cover;box-shadow:0 4px 12px rgba(20,60,200,.3)}
.mp{display:flex;align-items:center;background:var(--pn);border-radius:999px;padding:3px;box-shadow:var(--sd)}
.mp button{width:32px;height:32px;border:0;border-radius:50%;background:transparent;color:var(--tx);font-size:19px}
.mp span{font-size:14px;font-weight:600;padding:0 4px}
.hero{background:linear-gradient(150deg,#161d4d,#3a2f96 62%,#5b4bff);color:#fff;border-radius:26px;padding:22px 20px;margin-bottom:16px;box-shadow:0 16px 36px rgba(60,46,160,.35)}
.hero small{opacity:.72;font-size:13px}
.big{font-size:40px;font-weight:800;line-height:1.15;letter-spacing:.5px;margin:2px 0 4px}
.hero .chp{display:inline-block;background:rgba(255,255,255,.16);border-radius:999px;padding:2px 12px;font-size:12px}
.hr{display:flex;align-items:center;gap:18px;margin-top:18px}
.hr svg{flex:none;width:122px;height:122px}
.hl{flex:1;min-width:0}
.hl div{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:14px}
.hl i{width:9px;height:9px;border-radius:50%;flex:none}
.hl span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hl b{font-weight:600}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.qa button{border:0;border-radius:20px;background:var(--pn);box-shadow:var(--sd);padding:14px 4px 12px;color:var(--tx);font:inherit;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .1s}
.qa button:active{transform:scale(.96)}
.qa i{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;color:#fff}
.tl{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:8px}
.tl div{background:var(--pn);border-radius:20px;box-shadow:var(--sd);padding:14px 14px 14px 18px;position:relative;overflow:hidden}
.tl div:before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:4px;border-radius:0 4px 4px 0;background:var(--c)}
.tl small{color:var(--mu);font-size:12px;display:block}
.tl b{font-size:22px;display:block;line-height:1.3}
.note{color:var(--mu);font-size:12px;margin:0 4px 16px}
.pn{display:block;background:var(--pn);border-radius:22px;box-shadow:var(--sd);padding:18px 16px;margin-bottom:16px}
.pn h3{margin:0 0 12px;font-size:17px;display:flex;align-items:center;gap:8px}
.db{display:flex;align-items:center;gap:12px;background:rgba(255,107,107,.1);border:1px solid rgba(255,107,107,.3);border-radius:20px;padding:14px;margin-bottom:16px}
.db .di{width:38px;height:38px;border-radius:50%;background:#ff6b6b;color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.db>div:nth-child(2){flex:1}
.acc{padding:0;overflow:hidden}
.acc .ah{display:flex;justify-content:space-between;align-items:center;padding:16px}
.acc .ah h3{margin:0}
.acc .ah span{color:var(--mu);font-size:20px;transition:transform .2s}
.acc .ab{display:none;padding:0 16px 16px}
.acc.open .ab{display:block}.acc.open .ah span{transform:rotate(90deg)}
.mu{color:var(--mu)}
.lb{font-size:12px;color:var(--mu);margin:0 0 6px 2px}
.emp{text-align:center;padding:28px 0;color:var(--mu)}
.emp i{font-size:40px;font-style:normal;display:block;margin-bottom:6px;opacity:.85}
.emp p{margin:0;font-size:14px}
@keyframes g{from{stroke-dasharray:0 300}}
circle.sg{animation:g .9s ease}
@media(prefers-reduced-motion:reduce){circle.sg{animation:none}}
.bl{font-size:10px;fill:var(--mu);text-anchor:middle}
.st{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;gap:4px}
.st small{display:block;color:var(--mu);font-size:12px}.st b{font-size:17px}
.neg{color:#ff6b6b}.pos{color:#19c9a8}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{border:1.5px solid var(--c);color:var(--c);background:transparent;border-radius:999px;padding:7px 16px;font-size:14px;font-weight:500}
.chip.on{background:var(--c);color:#fff}
.seg{display:flex;margin-bottom:14px;background:var(--bg);border-radius:14px;padding:4px}
.seg button{flex:1;border:0;background:transparent;color:var(--mu);padding:9px 4px;font:inherit;font-weight:600;border-radius:11px}
.seg button.on{background:var(--pn);color:var(--ac);box-shadow:0 2px 8px rgba(40,50,110,.12)}
.seg button.on.due{color:#ff6b6b}
.row{display:flex;gap:8px;margin-bottom:12px}
.row>input,.row>select{flex:1 1 0;width:0}
input,textarea,select{width:100%;min-width:0;min-height:46px;background:var(--bg);color:var(--tx);border:1.5px solid transparent;border-radius:14px;padding:11px 13px;font:inherit}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ac)}
textarea{height:100px;font-size:12px;margin:8px 0 10px}
.btn{width:100%;border:0;border-radius:16px;padding:14px;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(135deg,#5b4bff,#7b5cff);box-shadow:0 8px 20px rgba(91,75,255,.35)}
.btn2{border:0;border-radius:14px;padding:0 18px;white-space:nowrap;background:var(--bg);color:var(--tx);font:inherit;font-weight:600;min-height:46px}
.lr{display:grid;grid-template-columns:12px 1fr auto auto;gap:4px 8px;align-items:center;padding:8px 0}
.lr i{width:10px;height:10px;border-radius:50%}
.lr em{font-style:normal;color:var(--mu);text-align:right;white-space:nowrap}
.lr u{grid-column:1/-1;height:5px;border-radius:5px;background:linear-gradient(90deg,var(--c) var(--w),var(--ln) var(--w))}
.it{display:grid;grid-template-columns:38px 1fr auto 10px;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--ln)}
.it:last-child{border:0}
.av{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;color:#fff;font-weight:700;background:var(--c)}
.ib{min-width:0}.ib b{display:block}
.ib small{display:block;color:var(--mu);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dh{display:flex;justify-content:space-between;color:var(--mu);font-size:13px;font-weight:600;padding:14px 0 4px}
.mc{border:1px solid var(--ln);border-radius:18px;padding:14px;margin-bottom:10px}
.mc .mh{display:flex;justify-content:space-between;margin-bottom:10px}
.m4{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.m4 small{display:block;color:var(--mu);font-size:12px}.m4 b{font-size:17px}
.x{border:0;background:transparent;color:var(--mu);font-size:13px;padding:6px 8px}
.tip{padding:12px 0;border-bottom:1px solid var(--ln)}.tip:last-child{border:0}
.kv{display:flex;justify-content:space-between;align-items:center;padding:8px 0}
.kv input{text-align:right}
.mi{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--ln)}
.mi:last-child{border:0}
.mi.dn{padding:5px 0;gap:10px;grid-template-columns:26px 1fr;font-size:14px}
.mi.dn .ck{width:24px;height:24px;font-size:12px;background:var(--ac);color:#fff}
.ck{width:30px;height:30px;border-radius:50%;border:2px solid var(--ac);background:transparent;color:var(--ac);font-size:15px}
.tg{display:inline-block;background:rgba(91,75,255,.12);color:var(--ac);border-radius:8px;padding:0 8px;font-size:12px;margin-right:6px}
.cx{display:inline-flex;align-items:center;gap:8px;background:var(--bg);border-radius:999px;padding:6px 8px 6px 14px;font-size:14px}
.cx b{width:20px;height:20px;border-radius:50%;background:var(--ln);color:var(--mu);display:grid;place-items:center;font-size:14px}
.mg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.mg button{border:0;border-radius:12px;background:var(--bg);color:var(--tx);padding:12px 0;font:inherit;font-weight:600}
.mg button.on{background:var(--ac);color:#fff}
.lk{color:var(--ac);text-decoration:underline;padding:4px 2px}
.hname{font-size:30px;font-weight:800;margin:4px 0 14px}
[data-open],[data-a]{cursor:pointer}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--pn);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px);z-index:9999}
nav button{flex:1;min-width:0;border:0;background:transparent;color:var(--mu);padding:8px 0 6px;font:inherit;font-size:12px}
nav i{display:grid;place-items:center;width:54px;height:30px;border-radius:15px;margin:0 auto 2px}
nav button.on{color:var(--ac);font-weight:700}
nav button.on i{background:rgba(91,75,255,.14)}
#sh{position:fixed;inset:0;background:rgba(10,14,40,.5);display:none;align-items:flex-end;z-index:10000}
#sh.on{display:flex}
#sh>div{background:var(--pn);width:100%;max-width:560px;margin:0 auto;border-radius:26px 26px 0 0;padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto;animation:up .25s ease}
#sh>div:before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--ln);margin:0 auto 14px}
#sh h3{margin:0 0 12px;font-size:18px}
#ts{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 20px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;z-index:21000}
#ts.s{opacity:1}#ts.u{pointer-events:auto}#ts .lk{color:inherit;font-weight:700}
.cb{display:flex;margin-bottom:10px}.cb.me{justify-content:flex-end}
.cb>div{max-width:82%;padding:10px 13px;border-radius:18px;background:var(--pn);box-shadow:var(--sd);white-space:pre-wrap;word-break:break-word}
.cb.me>div{background:var(--ac);color:#fff}
.cin{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:9000;background:var(--bg);padding:8px 16px}
.cin>div{max-width:560px;margin:0 auto;display:flex;gap:8px}
.ad{border-radius:20px;background:var(--pn);box-shadow:var(--sd);padding:14px 16px;margin-bottom:12px}
.ad.adt{background:linear-gradient(135deg,#ff9a3d,#ff6b6b);color:#fff}.adt .mu{color:rgba(255,255,255,.88)}.adt .tg{background:rgba(255,255,255,.22);color:#fff}
.tg.u{background:rgba(255,107,107,.15);color:#ff6b6b}
#lg{position:fixed;inset:0;z-index:20000;background:var(--bg);overflow:auto}
</style>
</head>

<div id="v"></div>
<nav></nav>
<div id="sh"></div>
<div id="ts"></div>
